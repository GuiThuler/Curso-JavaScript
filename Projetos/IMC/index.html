<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Modelo</title>
  <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

  <section class="container">
    <h1>Calcule seu IMC</h1>
    
      <p>IMC	Classificação	Obesidade (grau)</p>
      <p>Menor que 18,5	Magreza	0</p>
      <p>Entre 18,5 e 24,9	Normal	0</p>
      <p>Entre 25,0 e 29,9	Sobrepeso	I</p>
      <p>Entre 30,0 e 39,9	Obesidade	II</p>
      <p>Maior que 40,0	Obesidade Grave	III</p>
    
  
  <form action="" method="get" class="form">
    <label for="input-test-1">Peso</label>
    <input type="number" class="test-1">

    <label for="input-test-1">Altura</label>
    <input type="text" class="test-2">

    <button type="submit">Calcular</button>
  </form>
  <div class="resultado"></div>
  <script src="./assets/js/main.js"></script>
</section>
</body>

</html>
