<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade</title>
</head>
<body>
    <style>
        body {
        background-color: rgb(208, 255, 239);
        }
    </style>
    <script>
        const num = Number(prompt('Escolha um numero:'));
    
        document.body.innerHTML += `Seu numero é ${num}<br>`;

        document.body.innerHTML += `raiz quadrada: ${Math.sqrt(num)}<br>`;

        document.body.innerHTML += `Seu numero é NaN: ${Number.isNaN(num)}<br>`;

        document.body.innerHTML += `Numero inteiro: ${Number.isInteger(num)}<br>`;

        document.body.innerHTML += `Arredondando para maior: ${Math.floor(num)}<br>`;

        document.body.innerHTML += `Arredondando para menor: ${Math.ceil(num)}<br>`;

        document.body.innerHTML += `Com duas casas: ${(num.toFixed(2))}<br>`;

    </script>
</body>
</html>
