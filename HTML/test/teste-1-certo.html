<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correção</title>
    <style>
        * {
          margin: 0;
          padding: 0;
        }

        body {
            background-color: rgb(255, 246, 234);
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .topo {
          background-color: rgb(255, 249, 191);
          display: flex;
          justify-content: space-between;
          align-items: center;
          text-transform: uppercase;
        }

        .menu {
          padding: 2%;
        }

        .menu ul {
        display: flex;
        gap: 20px;
        list-style-type: none;
        padding: 3%;
        
        }

        button {
          text-transform: uppercase;
          margin: 1%;
          cursor: pointer;
          padding: 10px 20px;
        }

        button:hover {
          background-color: rgb(255, 228, 228);
        }

        footer {
          display: flex;
          justify-content: center;
          align-items: center;
          padding: 10%;
          background-color: bisque;
        }

        main {
          text-align: center;
          margin: 3%;
          flex: 1;
        }
    </style>
</head>
<body>
    <header class="topo">
  <img src="#" class="logo" alt="Logo">
  <nav class="menu">
    <ul>
      <li>Massas</li>
      <li>Pizzas</li>
      <li>Bebidas</li>
    </ul>
  </nav>
</header>

<main>
  <section>
    <h2>Bem-vindo ao Restaurante</h2>
    <p>O melhor da cidade...</p>
    <button>Pedir agora</button>
  </section>
</main>
<footer>
    <p>O terror dos preços baixos.</p>
</footer>
</body>
</html>
