<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:azure;
}

/* GRID DA PÁGINA */

.container{
    display:grid;
    grid-template-columns:220px 1fr;
    grid-template-rows:70px 1fr;
    grid-template-areas:
        "header header"
        "sidebar main";

    min-height:100vh;
}

/* HEADER */

header{
    grid-area:header;
    background:rgb(151,248,255);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
}

.menu{
    display:flex;
    gap:10px;
    list-style:none;
}

.menu a{
    text-decoration:none;
    background:rgb(163,163,214);
    padding:8px 12px;
    border-radius:5px;
    color:white;
    transition:.3s;
}

.menu a:hover{
    background:rgb(88,50,175);
}

/* SIDEBAR */

.sidebar{
    grid-area:sidebar;
    background:rgb(88,216,255);
    padding:20px;
}

.sidebar ul{
    list-style:none;
    display:flex;
    flex-direction:column;
    gap:20px;
}

.sidebar a{
    text-decoration:none;
    color:white;
    background:rgb(88,50,175);
    padding:10px;
    border-radius:5px;
    display:block;
}

/* MAIN */

main{
    grid-area:main;
    padding:30px;
}

/* GRID DOS CARDS */

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:rgb(215,242,255);
    padding:20px;
    border-radius:6px;
    transition:.3s;
}

.card:hover{
    background:rgb(201,255,232);
}

/* RESPONSIVO */

@media(max-width:900px){

.cards{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:600px){

.container{

grid-template-columns:1fr;

grid-template-areas:

"header"
"sidebar"
"main";

}

.cards{
grid-template-columns:1fr;
}

}

</style>
</head>

<body>

<div class="container">

<header>
<h1>Dashboard</h1>

<ul class="menu">
<li><a href="#">Home</a></li>
<li><a href="#">Sobre</a></li>
<li><a href="#">Contato</a></li>
</ul>

</header>

<nav class="sidebar">

<ul>
<li><a href="#">Resumos</a></li>
<li><a href="#">Análises</a></li>
<li><a href="#">Investimentos</a></li>
</ul>

</nav>

<main>

<div class="cards">

<div class="card">
<h2>Card</h2>
<p>Lorem ipsum dolor sit amet...</p>
</div>

<div class="card">
<h2>Card</h2>
<p>Lorem ipsum dolor sit amet...</p>
</div>

<div class="card">
<h2>Card</h2>
<p>Lorem ipsum dolor sit amet...</p>
</div>

<div class="card">
<h2>Card</h2>
<p>Lorem ipsum dolor sit amet...</p>
</div>

<div class="card">
<h2>Card</h2>
<p>Lorem ipsum dolor sit amet...</p>
</div>

</div>

</main>

</div>

</body>
</html>
